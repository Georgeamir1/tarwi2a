<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — ترويئة</title>
  <style>
    @font-face { font-family: 'Cairo'; src: url('assets/fonts/Cairo-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
    @font-face { font-family: 'Cairo'; src: url('assets/fonts/Cairo-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Cairo', sans-serif; background: #FDF8F7; color: #2C2120; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
    .container { max-width: 420px; }
    .code { font-size: 120px; font-weight: 800; color: #E02B2B; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; }
    p { font-size: 16px; color: #7A6B69; margin-bottom: 32px; line-height: 1.7; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 32px; background: #E02B2B; color: #fff; border-radius: 12px; font-size: 17px; font-weight: 700; font-family: 'Cairo', sans-serif; text-decoration: none; transition: all 150ms ease; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(224,43,43,0.3); }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">٤٠٤</div>
    <h1>الصفحة مش موجودة</h1>
    <p>يبدو إنك ضعت — الصفحة اللي بتدور عليها اتنقلت أو مش موجودة. رجع للصفحة الرئيسية وكمل من هناك.</p>
    <a href="/" class="btn">الرئيسية</a>
  </div>
</body>
</html>
