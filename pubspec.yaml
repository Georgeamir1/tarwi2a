name: tarwi2a
description: Food ordering app with admin panel
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.4

  # State Management
  flutter_bloc: ^8.1.6

  # Navigation
  go_router: ^14.8.1

  # UI
  cached_network_image: ^3.4.1
  badges: ^3.1.2

  # Architecture
  dartz: ^0.10.1
  get_it: ^8.0.3
  equatable: ^2.0.7

  # Code Generation Annotations
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Maps
  flutter_osm_plugin: ^1.3.0
  latlong2: ^0.9.0

  # Notifications
  flutter_local_notifications: ^21.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # PDF
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.2

  # Network/Offline
  connectivity_plus: ^5.0.2

  # Charts
  fl_chart: ^0.66.0

  # Share
  share_plus: ^7.2.2

  # External app launch (WhatsApp, tel, etc.)
  url_launcher: ^6.3.1

  # Image Picker
  image_picker: ^1.0.7

  # Utils
  intl: ^0.19.0
  timezone: ^0.11.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  logger: ^2.5.0
  html: ^0.15.4
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0

  # Observability
  sentry_flutter: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
